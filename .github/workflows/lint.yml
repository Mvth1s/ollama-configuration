name: Lint

# Runs ShellCheck over every Bash script under scripts/linux/. Run the same
# command locally: (cd scripts/linux && shellcheck -x *.sh lib/*.sh) (see
# README.md) - invoked from within scripts/linux/, not the repo root, because
# ShellCheck -x resolves each script's bare `source lib/common.sh` relative
# to ShellCheck's own working directory, not the checked file's directory;
# running it from the repo root against scripts/linux/*.sh (as this used to
# be invoked pre-restructure, when the scripts lived at the repo root and the
# two directories happened to coincide) produces spurious SC1091 "does not
# exist" warnings for lib/common.sh now that the scripts have moved. Also
# lints the Windows side (scripts/windows/setup.ps1 +
# scripts/windows/lib/common.ps1 + scripts/windows/toggle-webui-lan.ps1) with
# PSScriptAnalyzer, since ShellCheck has no PowerShell equivalent.
#
# Called from ci.yml (workflow_call) as one of the fast jobs that gate
# rust-ci.yml/e2e.yml; workflow_dispatch kept for a standalone manual run.
on:
  workflow_call:
  workflow_dispatch:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install ShellCheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y shellcheck

      # Cheap syntax-only pass ahead of ShellCheck's static analysis, so a
      # plain parse error (e.g. from a bad merge) is reported unambiguously
      # rather than buried in ShellCheck's own diagnostics.
      - name: bash -n syntax check
        run: |
          for f in scripts/linux/*.sh scripts/linux/lib/*.sh; do
            bash -n "$f"
          done

      # Run from within scripts/linux/ itself, not the repo root - see the
      # comment at the top of this file for why.
      - name: Run ShellCheck
        working-directory: scripts/linux
        run: shellcheck -x *.sh lib/*.sh

  psscriptanalyzer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser -Repository PSGallery

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          # -Path only accepts a single string, not an array, hence the loop
          # rather than one call over the three files.
          #
          # Excluded rules are deliberate design choices documented in
          # CLAUDE.md, not lint debt:
          #   PSAvoidGlobalVars      - $Global:* is this script's state-sharing
          #                            mechanism, the Windows counterpart to
          #                            state.env on Linux.
          #   PSAvoidUsingWriteHost  - Write-Host -ForegroundColor is used
          #                            over ANSI codes for PowerShell 5.1
          #                            console compatibility.
          #   PSUseApprovedVerbs     - Log-Info/Log-Ok/etc. mirror lib/common.sh's
          #                            log_info/log_ok naming on purpose.
          #   PSReviewUnusedParameter - false positive: $Tier (the script
          #                            param) is read inside Get-ModelTier via
          #                            PowerShell's normal script-scope
          #                            fallback, which this rule's static
          #                            analysis doesn't trace across functions.
          #   PSUseShouldProcessForStateChangingFunctions - Set-GpuConfig is
          #                            read-only (detects and logs, does not
          #                            mutate anything), despite the Set- verb.
          $excluded = 'PSAvoidGlobalVars', 'PSAvoidUsingWriteHost', 'PSUseApprovedVerbs', 'PSReviewUnusedParameter', 'PSUseShouldProcessForStateChangingFunctions'
          $files = 'scripts/windows/setup.ps1', 'scripts/windows/lib/common.ps1', 'scripts/windows/toggle-webui-lan.ps1'
          $results = $files | ForEach-Object { Invoke-ScriptAnalyzer -Path $_ -Severity Warning, Error -ExcludeRule $excluded }
          $results | Format-Table -AutoSize
          if ($results) {
            throw "PSScriptAnalyzer found $($results.Count) issue(s)."
          }
