name: Release

# A tag/release created here is pushed using the default GITHUB_TOKEN, which
# GitHub Actions deliberately excludes from triggering other workflows'
# push/tag events (anti-recursion measure) - so build-desktop.yml's
# `on: push: tags:` never fired on its own after the very first real
# release (v1.0.0: tag and GitHub Release were created, but zero installer
# assets were attached). Explicitly dispatching it below is the fix:
# workflow_dispatch is expressly exempted from that restriction.
#
# Called from ci.yml (workflow_call), gated on lint/test/rust-ci/e2e all
# succeeding first and restricted to push-to-main there - this is what
# stops a broken commit from reaching semantic-release (and, in cascade,
# build-desktop.yml) before its own tests have even run. workflow_dispatch
# kept for a standalone manual run (semantic-release itself still refuses
# to release from a branch outside .releaserc.json's `branches`, so this
# is safe to trigger from elsewhere - it just fails loudly instead).
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # semantic-release 25.x and @semantic-release/git 11.x both declare
      # engines requiring Node >=22 - a real requirement, not just a stale
      # warning: reproduced locally in Docker that `npm ci` against this
      # repo's committed package-lock.json fails under Node 20 *and* Node
      # 22 with "Missing: conventional-commits-filter@6.0.1 from lock
      # file", and only succeeds cleanly under Node 24 (matching e2e.yml's
      # existing node-version). This broke the first real push-to-main
      # release after the semantic-release/git dependency bump, since this
      # was still pinned to 20 at the time.
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install release tooling
        run: npm ci

      - name: Run semantic-release
        id: semantic
        uses: cycjimmy/semantic-release-action@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # semantic_release_action wraps the same npx semantic-release run
      # this repo used directly before, just exposing its outcome as step
      # outputs (new_release_published, new_release_git_tag) - config is
      # unchanged, still driven entirely by .releaserc.json/package.json.
      #
      # Looks up the release's numeric ID and passes it through as
      # build-desktop.yml's `release_id` input, rather than just the tag:
      # tauri-action needs the ID directly to attach assets without also
      # overwriting the release's name/body (see build-desktop.yml's own
      # comment on that bug).
      - name: Trigger desktop bundle build
        if: steps.semantic.outputs.new_release_published == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          release_id=$(gh api "repos/${{ github.repository }}/releases/tags/${{ steps.semantic.outputs.new_release_git_tag }}" --jq .id)
          gh workflow run build-desktop.yml --ref "${{ steps.semantic.outputs.new_release_git_tag }}" -f release_id="$release_id"
