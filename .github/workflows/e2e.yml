name: E2E (WebDriver)

# gui/dist and launcher/dist previously had no end-to-end coverage at all -
# only pure Rust functions extracted out of their #[tauri::command]s were
# unit-tested (see CLAUDE.md's Tests section). This drives the REAL built
# app windows through tauri-driver via WebdriverIO, the same way Tauri's own
# docs recommend:
# https://v2.tauri.app/develop/tests/webdriver/example/webdriverio/
#
# e2e-linux drives WebKitWebDriver, e2e-windows drives msedgedriver - see
# each job below. Called from ci.yml (workflow_call), gated on
# lint.yml/test.yml succeeding first since this is the single most expensive
# part of the pipeline; workflow_dispatch kept for a standalone manual run.
on:
  workflow_call:
  workflow_dispatch:

jobs:
  e2e-linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [gui, launcher]
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      # webkit2gtk-driver provides WebKitWebDriver (what tauri-driver drives
      # on Linux); xvfb provides the fake display the app runs against
      # headless. Verified locally that these two packages alone are enough
      # (no extra runtime deps needed beyond the WebKitGTK dev packages
      # already installed here for the build itself).
      - name: Install Linux WebKitGTK + WebDriver dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev librsvg2-dev webkit2gtk-driver xvfb

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "${{ matrix.app }}/src-tauri -> target"

      - name: Install tauri-driver
        run: cargo install tauri-driver --locked

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: ${{ matrix.app }}/e2e-tests/package-lock.json

      - name: npm install
        working-directory: ${{ matrix.app }}/e2e-tests
        run: npm install

      # onPrepare in wdio.conf.js builds the app itself (plain `cargo build`,
      # no tauri-cli/bundling involved - see gui/README.md and
      # launcher/README.md's dev workflow), so no separate build step here.
      - name: Run WebDriver e2e tests
        working-directory: ${{ matrix.app }}/e2e-tests
        run: xvfb-run --auto-servernum npm test

  # First real run (PR #65) confirmed the prediction below: it failed in
  # exactly the predicted step, msedgedriver-matching, but not for the
  # reason guessed (Program Files path / Edge channel were both fine -
  # windows-latest's Edge version was read correctly). Real cause:
  # msedgedriver.azureedge.net no longer resolves at all ("No such host is
  # known") - Microsoft has since moved Edge WebDriver downloads to
  # msedgedriver.microsoft.com, confirmed with a real HTTP 200 + matching
  # edgedriver_win64.zip for the exact Edge version (150.0.4078.65) the
  # failed run detected. Fixed below. The app/wdio.conf.js side was not the
  # problem, as predicted - this only needed the download host corrected.
  e2e-windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        app: [gui, launcher]
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "${{ matrix.app }}/src-tauri -> target"

      - name: Install tauri-driver
        run: cargo install tauri-driver --locked

      # windows-latest runners ship Microsoft Edge preinstalled, but
      # tauri-driver needs a msedgedriver.exe matching that exact Edge
      # version passed via --native-driver (no WebKitWebDriver-style
      # PATH auto-discovery on Windows). Reads the installed Edge's own
      # ProductVersion and downloads the matching driver build.
      - name: Download the msedgedriver matching this runner's Edge version
        shell: pwsh
        run: |
          $edgePath = "${env:ProgramFiles(x86)}\Microsoft\Edge\Application\msedge.exe"
          if (-not (Test-Path $edgePath)) {
            $edgePath = "$env:ProgramFiles\Microsoft\Edge\Application\msedge.exe"
          }
          $edgeVersion = (Get-Item $edgePath).VersionInfo.ProductVersion
          Write-Host "Detected Microsoft Edge version: $edgeVersion"
          $zipPath = Join-Path $env:RUNNER_TEMP 'edgedriver.zip'
          $destDir = Join-Path $env:RUNNER_TEMP 'edgedriver'
          Invoke-WebRequest -Uri "https://msedgedriver.microsoft.com/$edgeVersion/edgedriver_win64.zip" -OutFile $zipPath
          Expand-Archive -Path $zipPath -DestinationPath $destDir
          $driverPath = Join-Path $destDir 'msedgedriver.exe'
          "TAURI_DRIVER_NATIVE_DRIVER=$driverPath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: ${{ matrix.app }}/e2e-tests/package-lock.json

      - name: npm install
        working-directory: ${{ matrix.app }}/e2e-tests
        run: npm install

      # onPrepare in wdio.conf.js builds the app itself, same as e2e-linux.
      # No xvfb-run equivalent needed: unlike WebKitWebDriver, msedgedriver
      # drives a real (non-headless) Edge-based webview window directly on
      # the runner's desktop session.
      - name: Run WebDriver e2e tests
        working-directory: ${{ matrix.app }}/e2e-tests
        run: npm test
