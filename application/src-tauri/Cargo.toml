[package]
name = "selfllama-installer"
version = "0.1.0"
description = "Provisional package name (SelfLlama rename not finalized - see CLAUDE.md). Phase 4 of the SelfLlama restructure: the single-elevation-prompt privileged install phase (application::privileged), re-invoking this same binary under one pkexec call instead of gui/src-tauri's current three. No tauri dependency yet - nothing in this phase's code needs it; see CLAUDE.md's application/src-tauri section for why."
edition = "2021"
rust-version = "1.77"

[lib]
name = "selfllama_installer"
path = "src/lib.rs"

[[bin]]
name = "selfllama-installer"
path = "src/main.rs"

[dependencies]
core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
